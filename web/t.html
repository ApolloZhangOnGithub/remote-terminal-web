<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>终端</title>
<link rel="stylesheet" href="/terminal/xterm.css">
<script src="/terminal/xterm.js"></script>
<script src="/terminal/xterm-fit.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  #term{flex:1;min-height:0;padding:6px}
  #bar{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#161b22;
       border-top:1px solid #26303c;-webkit-overflow-scrolling:touch}
  #bar button{flex:0 0 auto;background:#21262d;color:#e6edf3;border:1px solid #30363d;
       border-radius:8px;padding:10px 12px;font-size:14px;font-family:monospace;
       min-width:46px;touch-action:manipulation;cursor:pointer}
  #bar button.on{background:#ff8a65;color:#1a1208;border-color:#ff8a65}
</style>
</head>
<body>
<div id="wrap">
  <div id="term"></div>
  <div id="bar"></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const dev = qs.get("m"), sid = qs.get("s");
const term = new Terminal({ cursorBlink:true, fontSize:14, scrollback:5000,
  fontFamily:'Menlo,Monaco,Consolas,"DejaVu Sans Mono",monospace',
  theme:{ background:'#0d1117', foreground:'#e6edf3', cursor:'#ff8a65' } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));

let ws, ctrlOn=false, altOn=false;
const enc = new TextEncoder();
function refit(){ try{ fit.fit(); sendResize(); }catch(e){} }
addEventListener('resize', refit);

function connect(){
  const proto = location.protocol==="https:" ? "wss" : "ws";
  const url = proto+"://"+location.host+"/m/"+encodeURIComponent(dev)+"/ws"+(sid?("?arg="+encodeURIComponent(sid)):"");
  ws = new WebSocket(url, ["tty"]);
  ws.binaryType = "arraybuffer";
  ws.onopen = ()=>{ ws.send(enc.encode(JSON.stringify({AuthToken:"",columns:term.cols,rows:term.rows}))); setTimeout(refit,60); };
  ws.onmessage = (e)=>{
    const data = (typeof e.data==="string") ? e.data : new TextDecoder().decode(e.data);
    if(data[0]==="0") term.write(data.slice(1));   // OUTPUT,其余指令(标题/偏好)忽略
  };
  ws.onclose = ()=>{ term.write("\r\n\x1b[38;5;245m[连接已断开,刷新页面重连]\x1b[0m\r\n"); };
}
// 按 ttyd 协议用二进制帧发送
function sendInput(d){ if(ws&&ws.readyState===1) ws.send(enc.encode("0"+d)); }
function sendResize(){ if(ws&&ws.readyState===1) ws.send(enc.encode("1"+JSON.stringify({columns:term.cols,rows:term.rows}))); }

// 物理键盘输入(Ctrl/Alt 修饰键按任意键后都复位,不卡死)
term.onData(d=>{
  if(d.length===1 && (ctrlOn || altOn)){
    if(ctrlOn){
      const c=d.toLowerCase().charCodeAt(0);
      sendInput((c>=97&&c<=122) ? String.fromCharCode(c-96) : d);
    } else {
      sendInput("\x1b"+d);
    }
    ctrlOn=false; altOn=false; render();
    return;
  }
  sendInput(d);
});

// 移动端按键栏(避免箭头符号,用文字标签)
const KEYS = [
  ["Esc",  ()=>sendInput("\x1b")],
  ["Tab",  ()=>sendInput("\t")],
  ["Ctrl", ()=>{ ctrlOn=!ctrlOn; altOn=false; render(); }, ()=>ctrlOn],
  ["Alt",  ()=>{ altOn=!altOn; ctrlOn=false; render(); }, ()=>altOn],
  ["Up",   ()=>sendInput("\x1b[A")],
  ["Down", ()=>sendInput("\x1b[B")],
  ["Left", ()=>sendInput("\x1b[D")],
  ["Right",()=>sendInput("\x1b[C")],
  ["Home", ()=>sendInput("\x1b[H")],
  ["End",  ()=>sendInput("\x1b[F")],
  ["^C",   ()=>sendInput("\x03")],
  ["^D",   ()=>sendInput("\x04")],
  ["^Z",   ()=>sendInput("\x1a")],
  ["C-b",  ()=>sendInput("\x02")],   // tmux 前缀键:之后按 % 竖分屏、" 横分屏、o 切换、c 新窗口
  ["%",    ()=>sendInput("%")],
  ['"',    ()=>sendInput('"')],
  ["|",    ()=>sendInput("|")],
  ["?",    ()=>sendInput("?")],
  ["/",    ()=>sendInput("/")],
  ["~",    ()=>sendInput("~")],
];
const bar = document.getElementById('bar');
const btns = KEYS.map(([label, fn, state])=>{
  const b=document.createElement('button');
  b.textContent=label;
  b.addEventListener('click',(ev)=>{ ev.preventDefault(); fn(); term.focus(); });
  b.dataset.state = state ? "1" : "";
  b._state = state;
  bar.appendChild(b);
  return b;
});
function render(){ btns.forEach(b=>{ if(b._state) b.classList.toggle('on', !!b._state()); }); }

connect();
term.focus();
addEventListener('click', e=>{ if(e.target.tagName!=="BUTTON") term.focus(); });
</script>
</body>
</html>
